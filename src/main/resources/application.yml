spring:
  application:
    name: byz-directory
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5435/directory}
    username: ${DB_USER:db}
    password: ${DB_PASS:db}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: directory
  flyway:
    schemas: directory
    default-schema: directory
    create-schemas: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IAM_JWKS_URL:https://iam.byzantineapp.dev/.well-known/jwks.json}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:directory}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    admin:
      fail-fast: false

server:
  port: ${PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: '{"time":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","service":"byz-directory","logger":"%logger{36}","msg":"%msg"}%n'

byz:
  kafka:
    enabled: ${BYZ_KAFKA_ENABLED:true}
    topics:
      iam-user: byz.iam.user
  iam:
    base-url: ${IAM_URL:https://iam.byzantineapp.dev}
    role-sync-enabled: ${IAM_ROLE_SYNC_ENABLED:true}
  tools:
    # When set, only JWTs for this org (e.g. Byz platform / byz-agent) may pass userId+organizationId overrides.
    # Empty = allow overrides (local/dev), same idea as byz-search.
    admin-organization-id: ${BYZ_ADMIN_ORGANIZATION_ID:}
